<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2.3 Card</title>
    <!-- เชื่อมโยงไฟล์ CSS -->
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <!-- หัวข้อด้านบนการ์ดตามโจทย์ -->
    <h2 class="page-title">User Profile Card</h2>

    <!-- ตัวการ์ดหลัก -->
    <div class="card">
        <!-- รูปโปรไฟล์ส่วนบนของการ์ด -->
        <div class="card-image">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=600&q=80" alt="Profile Picture">
        </div>

        <!-- ส่วนเนื้อหาข้อมูลข้างล่างรูปภาพ -->
        <div class="card-content">
            <!-- ชื่อล็อกอิน -->
            <h1>spotitat</h1>
            
            <!-- คำอธิบาย 2-3 คำ -->
            <p class="description">Level 25, The answer</p>
            <p class="location">42Paris</p>

            <!-- ตารางหรือแถวสำหรับไอคอนโซเชียลมีเดีย (Invisible table / Social icons) -->
            <table class="social-table">
                <tr>
                    <td><a href="#" target="_blank">🌐</a></td>
                    <td><a href="#" target="_blank">🐦</a></td>
                    <td><a href="#" target="_blank">in</a></td>
                    <td><a href="#" target="_blank">f</a></td>
                </tr>
            </table>
        </div>

        <!-- ปุ่ม Contact ด้านล่างสุดของการ์ด -->
        <button class="contact-btn">Contact</button>
    </div>

</body>
</html>
