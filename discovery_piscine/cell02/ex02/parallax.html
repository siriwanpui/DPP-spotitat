<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2.2 Parallax</title>

    <!-- เชื่อมโยงไฟล์ CSS -->
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- ส่วนที่ 1: ภาพ Parallax รูปแรก -->
    <div class="parallax bg-image-1">
        <div class="caption">
            <span class="border">Cute dog</span>
        </div>
    </div>

    <!-- ส่วนที่ 2: บล็อกสีดำตรงกลางตามโจทย์ -->
    <div class="section-dark">
        <p>Hi from 42Paris !</p>
    </div>

    <!-- ส่วนที่ 3: ภาพ Parallax รูปที่สอง (ด้านล่างสุด) -->
    <div class="parallax bg-image-2">
        <div class="caption">
            <span class="border">Fluffy dog</span>
        </div>
    </div>

</body>
</html>
