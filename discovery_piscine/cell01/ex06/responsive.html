<!DOCTYPE html>
<html>

<head>

    <title>C1.6</title>
    <style>
        /* ตั้งค่าสไตล์ของตาราง */
        table {
            border-collapse: collapse; /* ยุบเส้นขอบให้เป็นเส้นเดี่ยว */
            width: 100%;               /* ให้ตารางขยายกว้างเต็มหน้าจอ */
            max-width: 100%;          /* 800pxจำกัดความกว้างสูงสุดเพื่อให้ดูสวยงาม */
            height: 100vh;             /* (ตัวเลือก) หากต้องการให้สูงเต็มหน้าจอด้วย */
        }

        /* ตั้งค่าสไตล์ร่วมของกล่องทั้งสองช่อง */
        td {
            border: 1px solid #333333; /* เส้นขอบสีเข้มรอบกล่อง */
            height: 150px;             /* กำหนดความสูงของกล่อง */
            padding: 15px;             /* เว้นระยะห่างด้านในกล่องไม่ให้ตัวอักษรชิดขอบ */
            font-family: Arial, sans-serif;
            vertical-align: middle;       /* ให้ตัวอักษรอยู่ชิดด้านบนซ้ายเหมือนตัวอย่าง */
        }

        /* กำหนดสีพื้นหลังและความกว้างของกล่องแรก */
        .first-box {
            background-color: #b3bd6d; /* สีเขียวมะกอก */
            width: 50%;                /* แบ่งพื้นที่คนละครึ่งตาราง */
            height: 150px;             /* กำหนดความสูงของกล่อง */
        }

        /* กำหนดสีพื้นหลังและความกว้างของกล่องที่สอง */
        .second-box {
            background-color: #f7c3b2; /* สีชมพูอมส้ม/พีช */
            width: 50%;
            height: 150px;             /* กำหนดความสูงของกล่อง */
        }
        
        /* รีเซ็ตค่า Margin/Padding ของหน้าเว็บเพื่อให้ตารางชิดขอบเต็มหน้าจอ */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

/* จัดแต่งตารางให้ Responsive และเต็มหน้าจอ */
.responsive-table {
    width: 100%;             /* ทำให้ตารางกว้างเต็มหน้าจอ (Cover entire page) */
    height: 100vh;           /* (ตัวเลือก) หากต้องการให้สูงเต็มหน้าจอด้วย */
    border-collapse: collapse; /* ยุบขอบตารางให้ดูสวยงาม */
    table-layout: fixed;     /* บังคับให้คอลัมน์หดตัวตามขนาดตารางอย่างเท่าเทียมกัน */
}

/* เพิ่มการตกแต่งทั่วไปให้มองเห็นชัดเจน */
.responsive-table th, 
.responsive-table td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
    word-wrap: break-word;   /* บังคับให้ตัวหนังสือขึ้นบรรทัดใหม่เมื่อจอย่อเล็กมาก */
}

        
    </style>

</head>

<body>

    <table>
        <tr>
            <!-- ใส่ข้อความและเรียกใช้คลาสสีพื้นหลังที่กำหนดไว้ใน CSS -->
            <td class="first-box">First cell</td>
            <td class="second-box">Second cell</td>
        </tr>
    </table>

</body>
</html>
