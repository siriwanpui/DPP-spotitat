<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>C3.3 Todo-not todo</title>
    <!-- เชื่อมโยงไฟล์ตกแต่ง CSS -->
    <link rel="stylesheet" href="todo.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
        <!-- ปุ่มสร้างรายการใหม่ ตามโจทย์กำหนดให้ชื่อ 'New' -->
        <button id="new-btn">New</button>
        
        <!-- กล่องเก็บรายการ To Do ตามโจทย์กำหนดให้มี id เป็น 'ft_list' -->
        <div id="ft_list"></div>
    </div>

    <!-- เชื่อมโยงไฟล์ระบบ JavaScript -->
    <script src="todo.js"></script>
</body>
</html>
