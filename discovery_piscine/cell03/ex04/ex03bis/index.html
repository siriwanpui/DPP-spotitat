<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>C4.3 Todo-not todo</title>
    <!-- เชื่อมโยงไฟล์ตกแต่ง CSS[cite: 13] -->
    <link rel="stylesheet" href="todo.css">

    <!-- เพิ่มไลบรารี jQuery เข้ามาในโปรเจกต์ -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
        <!-- ปุ่มสร้างรายการใหม่ ตามโจทย์กำหนดให้ชื่อ 'New'[cite: 13] -->
        <button id="new-btn">New</button>
        
        <!-- กล่องเก็บรายการ To Do ตามโจทย์กำหนดให้มี id เป็น 'ft_list'[cite: 13] -->
        <div id="ft_list"></div>
    </div>

    <!-- เชื่อมโยงไฟล์ระบบ JavaScript[cite: 13] -->
    <script src="todo.js"></script>
</body>
</html>
